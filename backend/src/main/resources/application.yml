spring:
  application:
    name: procureiq-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/procureiq}
    username: ${DB_USERNAME:procureiq}
    password: ${DB_PASSWORD:procureiq}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always
