spring:
  application:
    name: procureiq-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/procureiq}
    username: ${DB_USERNAME:procureiq}
    password: ${DB_PASSWORD:procureiq}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

app:
  security:
    jwt:
      issuer: ${PROCUREIQ_JWT_ISSUER:procureiq}
      secret: ${PROCUREIQ_JWT_SECRET:procureiq-local-development-signing-key-2026-change-before-deployment}
      access-token-minutes: ${PROCUREIQ_ACCESS_TOKEN_MINUTES:480}
    demo-password: ${PROCUREIQ_DEMO_PASSWORD:ProcureIQ!Demo2026}
