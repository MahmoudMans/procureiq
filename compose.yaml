services:
  postgres:
    image: postgres:17-alpine
    container_name: procureiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: procureiq
      POSTGRES_USER: procureiq
      POSTGRES_PASSWORD: procureiq
    ports:
      - "5432:5432"
    volumes:
      - procureiq_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U procureiq -d procureiq
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  procureiq_postgres_data:
